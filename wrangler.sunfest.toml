#:schema node_modules/wrangler/config-schema.json
name = "sunfest2027"
compatibility_date = "2025-09-27"
compatibility_flags = ["nodejs_compat"]
main = "cloudflare/sunfest-worker.mjs"

# Behind Cloudflare Zero Trust Access on the custom domain below (one-time-PIN
# allowlist); no public *.workers.dev URL is exposed.
workers_dev = false

[assets]
directory = "./apps/sunfest2027/dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

[[routes]]
pattern = "sunfest.furrycolombia.com"
custom_domain = true
