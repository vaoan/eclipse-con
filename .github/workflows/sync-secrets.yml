# Packages GitHub repository secrets into an encrypted artifact for local download.
# Triggered by scripts/sync-secrets.mjs via `gh workflow run`.
#
# The workflow writes all known secrets to a file, encrypts it with a one-time
# passphrase provided as input, uploads the encrypted artifact (1-day
# retention), and deletes the unencrypted file. GitHub secrets are write-only,
# so this is how they become retrievable locally.

name: Sync Secrets

on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: "One-time encryption passphrase (generated by sync-secrets.mjs)"
        required: true
        type: string

permissions:
  actions: write

jobs:
  package-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Write secrets to file
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_FFXIVBE_ZERO_TRUST_API_TOKEN: ${{ secrets.CLOUDFLARE_FFXIVBE_ZERO_TRUST_API_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PHONE: ${{ secrets.TELEGRAM_PHONE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          TRANSLATE_PROVIDER: ${{ secrets.TRANSLATE_PROVIDER }}
          VITE_ANALYTICS_ENABLED: ${{ secrets.VITE_ANALYTICS_ENABLED }}
          VITE_CF_WEB_ANALYTICS_TOKEN: ${{ secrets.VITE_CF_WEB_ANALYTICS_TOKEN }}
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_GTM_CONTAINER_ID: ${{ secrets.VITE_GTM_CONTAINER_ID }}
        shell: bash
        run: |
          # Validate required secrets are present
          MISSING=""
          for KEY in CLOUDFLARE_API_TOKEN; do
            VAL=$(printenv "$KEY" || true)
            if [ -z "$VAL" ]; then
              MISSING="$MISSING $KEY"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::error::Missing required GitHub secrets:$MISSING"
            exit 1
          fi

          {
            echo "# Auto-generated by the sync-secrets workflow — do not edit manually."
            echo "# Last synced: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "# ─── Cloudflare (deploy + Zero Trust) ────────────────────────────"
            echo "CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}"
            echo "CLOUDFLARE_FFXIVBE_ZERO_TRUST_API_TOKEN=${CLOUDFLARE_FFXIVBE_ZERO_TRUST_API_TOKEN}"
            echo ""
            echo "# ─── Telegram account (news sync) ────────────────────────────────"
            echo "TELEGRAM_API_ID=${TELEGRAM_API_ID}"
            echo "TELEGRAM_API_HASH=${TELEGRAM_API_HASH}"
            echo "TELEGRAM_PHONE=${TELEGRAM_PHONE}"
            echo ""
            echo "# ─── Translation providers ───────────────────────────────────────"
            echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
            echo "OPENAI_MODEL=${OPENAI_MODEL}"
            echo "TRANSLATE_PROVIDER=${TRANSLATE_PROVIDER}"
            echo ""
            echo "# ─── Analytics (VITE_* — moonfest app runtime) ───────────────────"
            echo "VITE_ANALYTICS_ENABLED=${VITE_ANALYTICS_ENABLED}"
            echo "VITE_CF_WEB_ANALYTICS_TOKEN=${VITE_CF_WEB_ANALYTICS_TOKEN}"
            echo "VITE_POSTHOG_API_KEY=${VITE_POSTHOG_API_KEY}"
            echo "VITE_POSTHOG_HOST=${VITE_POSTHOG_HOST}"
            echo "VITE_GA_MEASUREMENT_ID=${VITE_GA_MEASUREMENT_ID}"
            echo "VITE_GTM_CONTAINER_ID=${VITE_GTM_CONTAINER_ID}"
          } > secrets-plain.txt

      - name: Encrypt secrets file
        env:
          PASSPHRASE: ${{ inputs.passphrase }}
        run: |
          openssl aes-256-cbc -pbkdf2 -salt \
            -in secrets-plain.txt \
            -out secrets-encrypted.bin \
            -pass env:PASSPHRASE

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secrets-encrypted
          path: secrets-encrypted.bin
          retention-days: 1
          if-no-files-found: error

      - name: Clean up unencrypted file
        if: always()
        run: rm -f secrets-plain.txt
