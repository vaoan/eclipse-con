name: Deploy Sunfest

# Deploys sunfest2027, the active Furry Colombia site, to its Cloudflare Worker
# on every push to main (a merged PR is a push), retrieving the Cloudflare
# token from the repository secret at run time. Pushes that only touch other
# apps, docs or print assets skip it. Can also be run by hand.
on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/moonfest2026/**"
      - "apps/links/**"
      - "packages/**"
      - "docs/**"
      - "publicity/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits for the running one instead of
# cancelling it halfway through an upload.
concurrency:
  group: deploy-sunfest
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Test sunfest site
        run: pnpm --filter sunfest2027 test

      - name: Build sunfest site
        run: pnpm --filter sunfest2027 build

      - name: Deploy to Cloudflare (token from secret)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy --config wrangler.sunfest.toml
