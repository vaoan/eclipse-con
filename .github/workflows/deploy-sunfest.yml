name: Deploy Sunfest

# Manual trigger — deploys the sunfest2027 teaser to its Cloudflare Worker,
# retrieving the Cloudflare token from the repository secret at run time.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build sunfest teaser
        run: pnpm --filter sunfest2027 build

      - name: Deploy to Cloudflare (token from secret)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy --config wrangler.sunfest.toml
