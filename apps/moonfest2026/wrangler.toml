#:schema node_modules/wrangler/config-schema.json
name = "eclipse-con"
compatibility_date = "2025-09-27"
compatibility_flags = ["nodejs_compat"]
main = "cloudflare/worker.mjs"

workers_dev = true
preview_urls = true

# Static assets (Vite build output)
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true
binding = "ASSETS"

# The archived site itself lives on its own assets-only Worker, so that its
# traffic is free — see wrangler.archive.toml. This Worker keeps only the two
# hosts that genuinely need code to run.
#
# Apex is a reverse proxy to the Carrd landing page (see cloudflare/worker.mjs),
# not the Moonfest SPA — it stays put.
[[routes]]
pattern = "furrycolombia.com"
custom_domain = true

# The retired host. The Worker 301s it to Sunfest (see cloudflare/worker.mjs);
# the route has to stay bound for those requests to reach the Worker at all.
[[routes]]
pattern = "moonfest.furrycolombia.com/*"
zone_name = "furrycolombia.com"

[env.staging]
name = "eclipse-con-staging"
main = "cloudflare/worker.mjs"

[[env.staging.routes]]
pattern = "staging-moonfest.furrycolombia.com/*"
zone_name = "furrycolombia.com"
